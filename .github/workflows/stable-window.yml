name: stable-window

# Weekly: live e2e against the last 3 stables of each axis (plus the CRS LTS
# from versions.lock.md when it is outside that window), one axis moved off
# its pin per cell (never a cartesian product), on x86_64 + aarch64.
# libmodsecurity tags below the build floor v3.0.13 are skipped. Catches
# connector drift against older/parallel release lines. Files the issue
# "stable-window: failing cells" on failure and closes it when green again.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      depth:
        description: "Stables per axis"
        required: false
        default: "3"
        type: string

concurrency:
  group: stable-window
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute cells from upstream stable releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ inputs.depth || '3' }}
        run: |
          set -euo pipefail
          [[ "$DEPTH" =~ ^[1-5]$ ]] || { echo "::error::depth must be 1-5"; exit 1; }
          cells='[{"cell":"pins","envoy":"","modsec":"","crs":""}]'
          add() { cells="$(python3 -c 'import json,sys; c=json.loads(sys.argv[1]); c.append(json.loads(sys.argv[2])); print(json.dumps(c))' "$cells" "$1")"; }
          cell() { # cell <axis> <tag>
            case "$1" in
              envoy) add "{\"cell\":\"envoy $2\",\"envoy\":\"$2\",\"modsec\":\"\",\"crs\":\"\"}" ;;
              modsecurity) add "{\"cell\":\"modsecurity $2\",\"envoy\":\"\",\"modsec\":\"$2\",\"crs\":\"\"}" ;;
              crs) add "{\"cell\":\"crs $2\",\"envoy\":\"\",\"modsec\":\"\",\"crs\":\"$2\"}" ;;
            esac
          }
          notes=()
          for axis in envoy modsecurity crs; do
            pin="$(./scripts/stable-releases.sh pin "$axis")"
            window="$(./scripts/stable-releases.sh window "$axis" "$DEPTH")"
            for tag in $window; do
              [[ "$tag" == "$pin" ]] && continue
              # modsec-engine's build.rs requires libmodsecurity >= 3.0.13.
              if [[ "$axis" == modsecurity && "$(printf '%s\n%s\n' "$tag" v3.0.13 | sort -V | head -1)" != v3.0.13 ]]; then
                notes+=("skipped modsecurity $tag (below the build floor v3.0.13)")
                continue
              fi
              cell "$axis" "$tag"
            done
            if [[ "$axis" == crs ]]; then
              lts="$(grep -E '^CRS_LTS_TAG=' versions.lock.md | cut -d= -f2)"
              if [[ -n "$lts" && "$lts" != "$pin" ]] && ! grep -qxF "$lts" <<<"$window"; then
                cell crs "$lts"
                notes+=("added crs $lts (CRS_LTS_TAG in versions.lock.md)")
              fi
            fi
          done
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          {
            python3 -c 'import json,sys; [print("-", c["cell"]) for c in json.loads(sys.argv[1])]' "$cells"
            for n in ${notes[@]+"${notes[@]}"}; do echo "- note: $n"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cell:
    name: ${{ matrix.cell }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    uses: ./.github/workflows/live-e2e.yml
    with:
      envoy_version: ${{ matrix.envoy }}
      modsecurity_pin: ${{ matrix.modsec }}
      crs_tag: ${{ matrix.crs }}
      suites: "smoke fail-closed fail-modes go-ftw-smoke"

  report:
    name: report
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci-report.sh --mode on-failure --title "stable-window: failing cells"
