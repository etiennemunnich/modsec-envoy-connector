name: crs-full

# Monthly: the whole OWASP CRS go-ftw regression tree (HTTP/1.x, status codes,
# demo/ftw/envoy-overrides.yaml) at the pins on x86_64 + aarch64, for every
# Envoy BodySendMode that honestly supports full CRS (BUFFERED, STREAMED,
# FULL_DUPLEX_STREAMED). BUFFERED_PARTIAL and NONE are excluded on purpose.
# Files the issue "crs-full: go-ftw failing" on failure and closes it when green.

on:
  schedule:
    - cron: "41 3 7 * *"
  workflow_dispatch:

# Runs on main (every schedule) get their own group, so they are never
# cancelled; other refs keep one run each.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('crs-full-main-{0}', github.run_id) || format('crs-full-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  full:
    name: go-ftw full (${{ matrix.body_mode }})
    strategy:
      fail-fast: false
      matrix:
        body_mode: [BUFFERED, STREAMED, FULL_DUPLEX_STREAMED]
    uses: ./.github/workflows/live-e2e.yml
    with:
      suites: "go-ftw-full"
      body_mode: ${{ matrix.body_mode }}
      timeout_minutes: 25

  report:
    name: report
    needs: full
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci-report.sh --mode on-failure --title "crs-full: go-ftw failing"
