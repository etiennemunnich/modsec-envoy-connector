name: modsec-window-matrix

# Connector build + clippy + tests against each libmodsecurity tag in the
# window (versions.window.md). Manual dispatch only.

on:
  workflow_dispatch:

concurrency:
  group: modsec-window-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: libmodsecurity ${{ matrix.modsecurity_pin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modsecurity_pin: [v3.0.16, v3.0.15, v3.0.14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ matrix.modsecurity_pin }}

      - name: Probe connector against ${{ matrix.modsecurity_pin }}
        env:
          MODSECURITY_PIN: ${{ matrix.modsecurity_pin }}
        run: ./scripts/probe-modsec-pin.sh --skip-install
