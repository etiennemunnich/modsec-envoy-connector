name: release

# Tag vX.Y.Z on main → gate (scripts/release-version.sh: the tag equals v +
# every crate version, pre-release included; scripts/release-gate.sh: the tag
# commit is on main, and a successful ci.yml run for that exact commit has
# every required check green from GitHub Actions) → per-arch native release
# build (x86_64, aarch64) → ext-proc-modsec-<ver>-linux-<arch>.tar.gz +
# .sha256 (bin/ finds lib/libmodsecurity.so via RUNPATH $ORIGIN/../lib;
# lib/libmodsec_dm.so alpha DM finds the same via RUNPATH $ORIGIN) →
# per-arch image pushed by digest (untagged) → multi-arch manifest
# ghcr.io/<owner>/<repo>:<ver> from both digests → GitHub Release (a
# pre-release for vX.Y.Z-suffix tags).
# Cost: images publish only on release tags (not on PRs or main pushes); no
# floating :latest. Stale GHCR cleanup is manual: scripts/ghcr-delete-stale.sh.
# Build provenance is attested when the repo is public.
# workflow_dispatch is a build-only dry run from any ref: it builds and tests
# the tarballs and images and uploads the tarballs as run artifacts. It pushes
# nothing to GHCR, tags nothing and creates no Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag equals v + the crate version
        if: github.ref_type == 'tag'
        run: ./scripts/release-version.sh "${GITHUB_REF_NAME}"
      - name: Tag commit is on main and ci is green for it
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: ./scripts/release-gate.sh
      - name: Dispatch is build-only
        if: github.ref_type != 'tag'
        run: |
          echo "workflow_dispatch on ${GITHUB_REF}: build and test only; nothing is pushed or released"

  build:
    name: build (${{ matrix.arch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ver="${GITHUB_REF_NAME}"
            ./scripts/release-version.sh "$ver"
          else
            ver="sha-${GITHUB_SHA::7}"
          fi
          {
            echo "version=$ver"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "pin=$(./scripts/stable-releases.sh pin modsecurity)"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ steps.meta.outputs.pin }}

      # bindgen for envoy-proxy-dynamic-modules-rust-sdk (modsec-dm).
      - name: libclang for DM SDK
        run: |
          set -euo pipefail
          if [[ ! -d /usr/lib/llvm-18/lib ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libclang-18-dev
          fi

      # RUNPATH $ORIGIN/../lib: the tarball's bin/ loads lib/libmodsecurity.so
      # without LD_LIBRARY_PATH, and so does the image (/usr/local/{bin,lib}).
      - name: cargo build --release (ext-proc-modsec)
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/../lib
        run: cargo build --release --locked -p ext-proc-modsec

      # RUNPATH $ORIGIN: lib/libmodsec_dm.so loads sibling lib/libmodsecurity.so*
      # when ENVOY_DYNAMIC_MODULES_SEARCH_PATH points at that lib/ directory.
      - name: cargo build --release (modsec-dm)
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: cargo build --release --locked -p modsec-dm

      - name: Package tarball
        id: pkg
        env:
          VER: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="ext-proc-modsec-${VER}-linux-${ARCH}"
          out="dist/${name}"
          mkdir -p "${out}/bin" "${out}/lib"
          install -m 0755 target/release/ext-proc-modsec "${out}/bin/"
          install -m 0755 target/release/libmodsec_dm.so "${out}/lib/"
          cp -P "${MODSECURITY_PREFIX:-$GITHUB_WORKSPACE/.local/modsecurity}"/lib/libmodsecurity.so* "${out}/lib/"
          cp LICENSE NOTICE versions.lock.md "${out}/"
          file "${out}/bin/ext-proc-modsec"
          file "${out}/lib/libmodsec_dm.so"
          rpath="$(readelf -d "${out}/bin/ext-proc-modsec" | grep -E '\((RUNPATH|RPATH)\)')" \
            || { echo "::error::binary has no RUNPATH"; exit 1; }
          echo "${rpath}"
          # shellcheck disable=SC2016 # a literal $ORIGIN, expanded by ld.so
          [[ "${rpath}" == *'[$ORIGIN/../lib]'* ]] || { echo "::error::binary RUNPATH is not \$ORIGIN/../lib"; exit 1; }
          # The libmodsecurity action exports LD_LIBRARY_PATH; prove the tarball works without it.
          env -u LD_LIBRARY_PATH ldd "${out}/bin/ext-proc-modsec" | tee "$RUNNER_TEMP/ldd.txt"
          lib="$(awk '/libmodsecurity\.so/ && $2 == "=>" { print $3; exit }' "$RUNNER_TEMP/ldd.txt")"
          [[ -n "${lib}" && "$(dirname "$(realpath "${lib}")")" == "$(realpath "${out}/lib")" ]] \
            || { echo "::error::libmodsecurity resolves to '${lib}', not ${out}/lib"; exit 1; }
          ! grep -q 'not found' "$RUNNER_TEMP/ldd.txt" || { echo "::error::unresolved libraries"; exit 1; }
          env -u LD_LIBRARY_PATH "${out}/bin/ext-proc-modsec" --version
          rpath_dm="$(readelf -d "${out}/lib/libmodsec_dm.so" | grep -E '\((RUNPATH|RPATH)\)')" \
            || { echo "::error::libmodsec_dm.so has no RUNPATH"; exit 1; }
          echo "${rpath_dm}"
          # shellcheck disable=SC2016 # a literal $ORIGIN, expanded by ld.so
          [[ "${rpath_dm}" == *'[$ORIGIN]'* ]] || { echo "::error::libmodsec_dm.so RUNPATH is not \$ORIGIN"; exit 1; }
          env -u LD_LIBRARY_PATH ldd "${out}/lib/libmodsec_dm.so" | tee "$RUNNER_TEMP/ldd-dm.txt"
          lib_dm="$(awk '/libmodsecurity\.so/ && $2 == "=>" { print $3; exit }' "$RUNNER_TEMP/ldd-dm.txt")"
          [[ -n "${lib_dm}" && "$(dirname "$(realpath "${lib_dm}")")" == "$(realpath "${out}/lib")" ]] \
            || { echo "::error::libmodsec_dm libmodsecurity resolves to '${lib_dm}', not ${out}/lib"; exit 1; }
          ! grep -q 'not found' "$RUNNER_TEMP/ldd-dm.txt" || { echo "::error::libmodsec_dm unresolved libraries"; exit 1; }
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" && cat "${name}.tar.gz.sha256")
          echo "dir=${out}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256
          retention-days: 7

      - name: Build and test the ${{ matrix.platform }} image
        env:
          VER: ${{ steps.meta.outputs.version }}
          DIR: ${{ steps.pkg.outputs.dir }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx create --name release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3 --use
          docker buildx build --platform "$PLATFORM" -f packaging/Dockerfile \
            --label org.opencontainers.image.version="$VER" --load -t local/ext-proc-modsec:test "$DIR"
          docker run --rm local/ext-proc-modsec:test --version

      # Tags only. Pushed by digest: nothing is tagged until both arches passed (manifest job).
      - name: Push the ${{ matrix.platform }} image by digest
        if: github.ref_type == 'tag'
        id: img
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VER: ${{ steps.meta.outputs.version }}
          DIR: ${{ steps.pkg.outputs.dir }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          labels=(
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
            --label org.opencontainers.image.revision="$GITHUB_SHA"
            --label org.opencontainers.image.version="$VER"
            --label org.opencontainers.image.licenses=Apache-2.0
          )
          docker buildx build --platform "$PLATFORM" -f packaging/Dockerfile "${labels[@]}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" "$DIR"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/meta.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in buildx metadata"; exit 1; }
          echo "${IMAGE}@${digest}"
          mkdir -p "$RUNNER_TEMP/digests" && echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    name: multi-arch manifest
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.m.outputs.image }}
      digest: ${{ steps.m.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Tag the multi-arch manifest (from the per-arch digests)
        id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ver="$GITHUB_REF_NAME"
          x86="$(cat "$RUNNER_TEMP/digests/x86_64")" arm="$(cat "$RUNNER_TEMP/digests/aarch64")"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "${image}:${ver}" "${image}@${x86}" "${image}@${arm}"
          docker buildx imagetools inspect "${image}:${ver}" | tee -a "$GITHUB_STEP_SUMMARY"
          digest="$(docker buildx imagetools inspect "${image}:${ver}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # Artifact attestations need a public repo (or GitHub Enterprise Cloud) for private ones.
      - name: Build provenance for the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.m.outputs.image }}
          subject-digest: ${{ steps.m.outputs.digest }}
          push-to-registry: true

  github-release:
    name: github release
    if: github.ref_type == 'tag'
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ext-proc-modsec-*
          path: dist
          merge-multiple: true
      - name: Build provenance for the tarballs
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.manifest.outputs.image }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE}:${GITHUB_REF_NAME}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::missing multi-arch digest from manifest job"; exit 1; }
          {
            echo "Envoy ext_proc → libmodsecurity connector ${GITHUB_REF_NAME}."
            echo
            echo "Pins (versions.lock.md):"
            fence="\`\`\`"
            echo "$fence"
            sed -n "/^${fence}\$/,/^${fence}\$/p" versions.lock.md | sed "/^${fence}\$/d"
            echo "$fence"
            echo
            echo "- Image (linux/amd64, linux/arm64): \`${image_tag}\`"
            echo "- Image digest (pin this): \`${IMAGE}@${DIGEST}\`"
            echo "- Tarballs bundle \`bin/ext-proc-modsec\`, \`lib/libmodsecurity.so*\`, and alpha \`lib/libmodsec_dm.so\`; they need Ubuntu 24.04 runtime libraries: libpcre2-8-0 libxml2 libyajl2 libcurl4t64 libgeoip1t64 liblmdb0. The binary finds \`lib/\` through its RUNPATH (\`\$ORIGIN/../lib\`); the DM \`.so\` finds sibling \`libmodsecurity\` through \`\$ORIGIN\`. Keep \`bin/\` and \`lib/\` side by side; no \`LD_LIBRARY_PATH\` needed. DM is early-testing only (not fail-closed absolute); rebuild on every Envoy bump."
          } > notes.md
          pre=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag "${pre[@]}" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256
