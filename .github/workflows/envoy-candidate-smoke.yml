name: envoy-candidate-smoke

# Run the demo drills (smoke, fail-closed, H1/H2 fail-mode suite, CRS loaded)
# against one Envoy release binary on Ubuntu, with the pinned libmodsecurity
# and CRS. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      envoy_version:
        description: "Envoy release tag (e.g. v1.39.1, v1.38.4, v1.37.6)"
        required: true
        default: "v1.39.1"
        type: string

concurrency:
  group: envoy-candidate-smoke-${{ inputs.envoy_version }}
  cancel-in-progress: true

jobs:
  drills:
    name: envoy ${{ inputs.envoy_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Read pins
        id: pins
        run: grep -E '^(MODSECURITY_PIN|CRS_TAG)=' versions.lock.md >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ steps.pins.outputs.MODSECURITY_PIN }}

      - name: Install Envoy ${{ inputs.envoy_version }}
        env:
          ENVOY_VERSION: ${{ inputs.envoy_version }}
          ENVOY_BIN_DIR: ${{ runner.temp }}/envoy-bin
        run: |
          command -v lsof >/dev/null || sudo apt-get install -y --no-install-recommends lsof
          ./demo/scripts/install-envoy.sh
          echo "${ENVOY_BIN_DIR}" >> "$GITHUB_PATH"

      - name: Drills
        env:
          ENVOY_VERSION: ${{ inputs.envoy_version }}
        run: ./scripts/envoy-candidate-smoke.sh

      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envoy-${{ inputs.envoy_version }}-demo-run
          path: |
            demo/.run/*.log
            demo/.run/fail-modes/
          if-no-files-found: ignore
