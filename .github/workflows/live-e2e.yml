name: live-e2e

# Reusable live cell: Envoy → connector → libmodsecurity (+ CRS) on GitHub-
# hosted Ubuntu, natively on x86_64 and aarch64 (no QEMU, no cross-compile).
# Empty version inputs mean "the pin in versions.lock.md".

on:
  workflow_call:
    inputs:
      envoy_version:
        type: string
        default: ""
      modsecurity_pin:
        type: string
        default: ""
      crs_tag:
        type: string
        default: ""
      suites:
        description: "space-separated: smoke fail-closed fail-modes hop-trace go-ftw-smoke go-ftw-body go-ftw-full"
        type: string
        default: "smoke fail-closed fail-modes hop-trace go-ftw-smoke"
      timeout_minutes:
        type: number
        default: 45

permissions:
  contents: read

env:
  GO_FTW_VERSION: "2.6.0"

jobs:
  e2e:
    name: e2e (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, ftw_arch: amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, ftw_arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve versions
        id: v
        env:
          IN_ENVOY: ${{ inputs.envoy_version }}
          IN_MODSEC: ${{ inputs.modsecurity_pin }}
          IN_CRS: ${{ inputs.crs_tag }}
        run: |
          set -euo pipefail
          pick() { local axis="$1" in="$2" v; v="${in:-$(./scripts/stable-releases.sh pin "$axis")}"
            ./scripts/stable-releases.sh valid "$axis" "$v" || { echo "::error::bad $axis version '$v'" >&2; exit 1; }
            echo "$v"; }
          # Plain assignments so a failing pick aborts the step (inside echo "$(...)" it would not).
          envoy="$(pick envoy "$IN_ENVOY")"
          modsec="$(pick modsecurity "$IN_MODSEC")"
          crs="$(pick crs "$IN_CRS")"
          printf 'envoy=%s\nmodsec=%s\ncrs=%s\n' "$envoy" "$modsec" "$crs" | tee -a "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rust-toolchain

      - name: OS id
        id: os
        run: . /etc/os-release && echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: e2e-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ steps.v.outputs.modsec }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: e2e-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ steps.v.outputs.modsec }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ steps.v.outputs.modsec }}

      - name: Cache Envoy ${{ steps.v.outputs.envoy }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/envoy-bin
          key: envoy-${{ steps.v.outputs.envoy }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Envoy ${{ steps.v.outputs.envoy }}, go-ftw, lsof
        env:
          ENVOY_VERSION: ${{ steps.v.outputs.envoy }}
          ENVOY_BIN_DIR: ${{ runner.temp }}/envoy-bin
          FTW_ARCH: ${{ matrix.ftw_arch }}
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          command -v lsof >/dev/null || sudo apt-get install -y --no-install-recommends lsof
          PATH="${ENVOY_BIN_DIR}:${PATH}" ./demo/scripts/install-envoy.sh
          echo "${ENVOY_BIN_DIR}" >> "$GITHUB_PATH"
          if [[ "${SUITES}" == *go-ftw* ]]; then
            dir="${RUNNER_TEMP}/go-ftw" base="https://github.com/coreruleset/go-ftw/releases/download/v${GO_FTW_VERSION}"
            asset="ftw_${GO_FTW_VERSION}_linux_${FTW_ARCH}.tar.gz"
            mkdir -p "$dir" && cd "$dir"
            curl -fsSL --retry 3 -O "${base}/${asset}" -O "${base}/ftw-checksums.txt"
            grep " ${asset}\$" ftw-checksums.txt | sha256sum -c -
            tar xzf "${asset}" ftw
            ./ftw -v
            echo "$dir" >> "$GITHUB_PATH"
          fi

      - name: Live suites (${{ inputs.suites }})
        env:
          SUITES: ${{ inputs.suites }}
          ENVOY_VERSION: ${{ steps.v.outputs.envoy }}
          MODSECURITY_PIN: ${{ steps.v.outputs.modsec }}
          CRS_TAG: ${{ steps.v.outputs.crs }}
          EXPECT_ARCH: ${{ matrix.arch }}
        run: ./scripts/ci-live-e2e.sh

      - name: Upload demo logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.arch }}-envoy${{ steps.v.outputs.envoy }}-modsec${{ steps.v.outputs.modsec }}-crs${{ steps.v.outputs.crs }}
          path: |
            demo/.run/*.log
            demo/.run/*.md
            demo/.run/fail-modes/
            demo/.run/go-ftw/
            demo/.run/hop-trace/
          retention-days: 5
          if-no-files-found: ignore
