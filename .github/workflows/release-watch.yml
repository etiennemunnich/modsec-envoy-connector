name: release-watch

# Daily: look for stable Envoy v1.x / libmodsecurity v3.0.x / CRS v4.x
# releases newer than versions.lock.md (filtered from the releases list, not
# releases/latest). Each new tag gets a tracking issue and a stable-candidate
# run on both architectures. A tag is skipped once its issue records a
# result (a pass, or three failures); tracking state is created only after
# the dispatch succeeded (scripts/release-watch.sh).
# A failing watch files the issue "release-watch: failing" (closed when green).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Also test <axis>:<tag> (e.g. envoy:v1.38.4), even if not newer"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Report only; open no issue, dispatch nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: watch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public repos disable schedules after 60 days without repo activity, and this
      # watcher creates none; re-enabling daily keeps all three schedules alive.
      - name: Keep the scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for w in release-watch.yml stable-window.yml crs-full.yml; do
            gh workflow enable "$w" --repo "$GITHUB_REPOSITORY"
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" -q '.workflows[] | "\(.name): \(.state)"'
      - name: Find new stable releases and dispatch candidates
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ./scripts/release-watch.sh

  # A failed scheduled run would otherwise only email the cron's last editor.
  report:
    name: report
    needs: watch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci-report.sh --mode on-failure --title "release-watch: failing"
