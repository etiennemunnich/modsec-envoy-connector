name: ash

# AWS Automated Security Helper v3.7.1 tip, local mode.
# Install is commit-pinned (ASH_PIN in versions.lock.md); pin-check asserts the
# pip line matches. Same steps as the official GitHub Actions example:
# https://awslabs.github.io/automated-security-helper/tutorials/running-ash-in-ci/
# Actions are commit-pinned and the runner is ubuntu-24.04 so pin-check stays green.
# Report-only: .ash/.ash.yaml sets fail_on_findings false, because a scan of
# the existing tree already exits 2. Set that field to true to enforce.
#
# Triggers: PRs that touch security-relevant paths (workflows, ASH config, Rust,
# scripts, demo, tools, packaging, deps), weekly on main tip (full tree,
# including docs for detect-secrets), and dispatch. Not every main push and not
# docs-only PRs. On main, a failed scan files the issue "ash: failing" (closed
# when green); PR runs report on the PR only.

on:
  pull_request:
    paths:
      - ".github/**"
      - ".ash/**"
      - "crates/**"
      - "scripts/**"
      - "demo/**"
      - "proto/**"
      - "tools/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "**/Dockerfile*"
      - "versions.lock.md"
  schedule:
    - cron: "11 3 * * 1"
  workflow_dispatch:

# Same concurrency shape as ci.yml: one in-flight run per PR, main is never cancelled.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ash-main-{0}', github.run_id) || format('ash-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: ash
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # ASH_PIN in versions.lock.md; pin-check asserts this SHA matches.
      - name: Install ASH (commit-pinned v3.7.1 tip)
        run: pip install "git+https://github.com/awslabs/automated-security-helper.git@af1206aff596f1288ad066828058b3011de2a998"

      - name: Run ASH
        run: ash --mode local

      - name: Upload ASH report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-results
          path: .ash/ash_output
          include-hidden-files: true
          if-no-files-found: error

  report:
    name: report
    needs: scan
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/ci-report.sh --mode on-failure --title "ash: failing"
