name: ci

# Gate for every push to main (and PRs, for a future public repo):
#   pin-check · rust-quality × {x86_64, aarch64} · live e2e at the pins × {x86_64, aarch64}
# cursor/** branches get pin-check + rust-quality only. Doc-only changes skip CI;
# versions.lock.md always runs it. GitHub-hosted runners only.

on:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "versions.lock.md"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "versions.lock.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENVOY_PIN: v1.39.1
  MODSECURITY_PIN: v3.0.16
  CRS_TAG: v4.29.0

jobs:
  pin-check:
    name: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert versions.lock.md pins
        run: ./scripts/check-pins.sh

  rust-quality:
    name: rust-quality (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: quality-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.MODSECURITY_PIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: quality-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.MODSECURITY_PIN }}-

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ env.MODSECURITY_PIN }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build -p ext-proc-modsec
        run: cargo build -p ext-proc-modsec

  e2e-pin:
    name: e2e-pin
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: pin-check
    uses: ./.github/workflows/live-e2e.yml
    with:
      suites: "smoke fail-closed fail-modes hop-trace go-ftw-smoke"
