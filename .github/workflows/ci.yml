name: ci

# Gate for main (work lands there directly), cursor/** branches, PRs and dispatches.
#   pin-check                          every run (pins, workflow rules)
#   rust-quality × {x86_64, aarch64}   fmt, clippy, test, build
#   msrv                               cargo check at the crates' rust-version
#   supply-chain                       cargo-deny: RustSec advisories, licenses, bans, sources
#   e2e-pin × {x86_64, aarch64}        live suites at the pins; push to main, PRs and
#                                      dispatches (not cursor/** pushes)
#   ci-ok                              one verdict over all of the above
# Docs-only changes (docs/**, *.md except versions.lock.md) skip the heavy jobs via
# the changes job, so ci-ok still reports; runs on main are never cancelled.
# GitHub-hosted runners only.

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ENVOY_PIN: v1.39.1
  MODSECURITY_PIN: v3.0.16
  CRS_TAG: v4.29.0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Docs-only change?
        id: d
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: ./scripts/ci-changes.sh

  pin-check:
    name: pin-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert versions.lock.md pins
        run: ./scripts/check-pins.sh
      - name: Workflow rules (SHA-pinned actions, pinned runners)
        run: ./scripts/check-workflows.sh

  rust-quality:
    name: rust-quality (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-toolchain

      - name: OS id
        id: os
        run: . /etc/os-release && echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: quality-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ env.MODSECURITY_PIN }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: quality-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ env.MODSECURITY_PIN }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ env.MODSECURITY_PIN }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build -p ext-proc-modsec
        run: cargo build -p ext-proc-modsec

  msrv:
    name: msrv (rust-version)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ env.MODSECURITY_PIN }}
      - name: cargo check with the crates' rust-version
        run: |
          set -euo pipefail
          msrv="$(grep -m1 '^rust-version' crates/ext-proc-modsec/Cargo.toml | cut -d'"' -f2)"
          [[ "${msrv}" == "$(grep -m1 '^rust-version' crates/modsec-engine/Cargo.toml | cut -d'"' -f2)" ]] \
            || { echo "::error::crates declare different rust-version values"; exit 1; }
          rustup toolchain install "${msrv}" --profile minimal
          cargo "+${msrv}" --version
          cargo "+${msrv}" check --workspace --all-targets --locked

  supply-chain:
    name: supply-chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }} (release binary, sha256-pinned)
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: cargo deny check (RustSec advisories, bans, licenses, sources)
        run: cargo deny --locked check advisories bans licenses sources

  e2e-pin:
    name: e2e-pin
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, pin-check]
    uses: ./.github/workflows/live-e2e.yml
    with:
      suites: "smoke fail-closed fail-modes hop-trace go-ftw-smoke"

  ci-ok:
    name: ci-ok
    needs: [changes, pin-check, rust-quality, msrv, supply-chain, e2e-pin]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed (or was skipped by design)
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          E2E_WANTED: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          docs_only = os.environ["DOCS_ONLY"] == "true"
          e2e_wanted = os.environ["E2E_WANTED"] == "true"
          heavy = {"rust-quality", "msrv", "supply-chain", "e2e-pin"}
          bad = []
          for job, v in needs.items():
              r = v["result"]
              ok = r == "success" or (r == "skipped" and (
                  (docs_only and job in heavy) or (job == "e2e-pin" and not e2e_wanted)))
              print(f"{'ok  ' if ok else 'FAIL'} {job}: {r}")
              if not ok:
                  bad.append(f"{job}={r}")
          if bad:
              print(f"::error::ci-ok: {', '.join(bad)}")
              sys.exit(1)
          PY
