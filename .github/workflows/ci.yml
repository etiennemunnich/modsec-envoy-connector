name: ci

# Gate for main (work lands there directly), PRs and dispatches. A branch is
# tested by its pull request (or gh workflow run ci.yml --ref <branch>): branch
# pushes do not run this workflow (no cursor/** push trigger).
#   pin-check                          every run (pins, workflow rules)
#   rust-quality × {x86_64, aarch64}   fmt, clippy, test, build (--locked)
#   msrv                               cargo check at the crates' rust-version
#   supply-chain                       cargo-deny: RustSec advisories, licenses, bans, sources
#   protos                             committed pb/ matches proto/ (protoc 25.3)
#   e2e-pin × {x86_64, aarch64}        live BUFFERED suites at the pins; push to main,
#                                      PRs and dispatches;
#                                      includes buffered-oversize + connect-assert
#   e2e-streamed × {x86_64, aarch64}   STREAMED product contract (same suites as e2e-pin;
#                                      go-ftw-full via crs-full matrix incl. STREAMED)
#   e2e-full-duplex × {x86_64, aarch64} FULL_DUPLEX product contract (same suites as
#                                      e2e-streamed; hang→504 N/A; go-ftw-full via crs-full)
#   ci-ok                              one verdict over all of the above
# Lab body modes (BUFFERED_PARTIAL, NONE, asymmetric) run weekly via e2e-lab.yml.
# Docs-only changes (docs/**, *.md except versions.lock.md) skip the heavy jobs via
# the changes job, so ci-ok still reports; so does a push to main whose tree
# already passed on a pull request from this repository (scripts/ci-tested-tree.sh:
# the merge would re-test identical files). Runs on main are never cancelled.
# GitHub-hosted runners only.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A concurrency group always cancels its *pending* run when a newer one queues,
# whatever cancel-in-progress says, so main gets one group per run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # earlier ci runs of the same tree (ci-tested-tree.sh)
      contents: read
    outputs:
      skip: ${{ steps.d.outputs.docs_only == 'true' || steps.t.outputs.tested == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Docs-only change?
        id: d
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: ./scripts/ci-changes.sh
      - name: Tree already passed on a pull request?
        id: t
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: ./scripts/ci-tested-tree.sh

  pin-check:
    name: pin-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions.lock.md pins (and install-script fallbacks)
        run: ./scripts/check-pins.sh
      - name: Workflow rules (SHA-pinned actions, pinned runners)
        run: ./scripts/check-workflows.sh
      - name: CI helper script tests (offline)
        run: ./scripts/test-ci-scripts.sh
      - name: checkout left no credentials in the git config
        run: |
          if git config --list --show-origin | grep -iE 'extraheader|authorization|includeif\..*\.path'; then
            echo "::error::git config still carries checkout credentials"
            exit 1
          fi
          echo "no credential entries in git config"

  rust-quality:
    name: rust-quality (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - name: libmodsecurity pin (versions.lock.md)
        id: pins
        run: |
          set -euo pipefail
          modsec="$(./scripts/stable-releases.sh pin modsecurity)"
          echo "modsec=${modsec}" | tee -a "$GITHUB_OUTPUT"

      - name: OS id
        id: os
        run: . /etc/os-release && echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: quality-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ steps.pins.outputs.modsec }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: quality-cargo-${{ steps.os.outputs.id }}-${{ runner.arch }}-${{ steps.pins.outputs.modsec }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ steps.pins.outputs.modsec }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build -p ext-proc-modsec
        run: cargo build -p ext-proc-modsec --locked

  msrv:
    name: msrv (rust-version)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libmodsecurity pin (versions.lock.md)
        id: pins
        run: |
          set -euo pipefail
          modsec="$(./scripts/stable-releases.sh pin modsecurity)"
          echo "modsec=${modsec}" | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/libmodsecurity
        with:
          pin: ${{ steps.pins.outputs.modsec }}
      - name: cargo check with the crates' rust-version
        run: |
          set -euo pipefail
          msrv="$(grep -m1 '^rust-version' crates/ext-proc-modsec/Cargo.toml | cut -d'"' -f2)"
          [[ "${msrv}" == "$(grep -m1 '^rust-version' crates/modsec-engine/Cargo.toml | cut -d'"' -f2)" ]] \
            || { echo "::error::crates declare different rust-version values"; exit 1; }
          rustup toolchain install "${msrv}" --profile minimal
          cargo "+${msrv}" --version
          cargo "+${msrv}" check --workspace --all-targets --locked

  supply-chain:
    name: supply-chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }} (release binary, sha256-pinned)
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: cargo deny check (RustSec advisories, bans, licenses, sources)
        run: cargo deny --locked check advisories bans licenses sources

  protos:
    name: protos (gen-protos --check)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The committed pb/ is byte-identical only with this protoc (apt ships 3.21).
      PROTOC_VERSION: "25.3"
      PROTOC_SHA256: f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - name: Install protoc ${{ env.PROTOC_VERSION }} (release zip, sha256-pinned)
        run: |
          set -euo pipefail
          zip="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${zip}"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/protoc"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
      - name: Generated ext_proc code matches proto/
        run: ./scripts/gen-protos.sh --check

  e2e-pin:
    name: e2e-pin
    if: needs.changes.outputs.skip != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, pin-check]
    uses: ./.github/workflows/live-e2e.yml
    with:
      # Product BUFFERED contract. trailers last (restarts Envoy with SEND, then restores).
      # buffered-oversize before trailers (also restarts Envoy); connect-assert is cheap.
      suites: "smoke fail-closed fail-modes hop-trace go-ftw-smoke buffered-oversize connect-assert trailers"
      body_mode: BUFFERED

  e2e-streamed:
    name: e2e-streamed
    if: needs.changes.outputs.skip != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, pin-check]
    uses: ./.github/workflows/live-e2e.yml
    with:
      # STREAMED matches BUFFERED product contract. Full CRS is hosted via
      # crs-full matrix (BUFFERED + STREAMED + FULL_DUPLEX), not this PR cell.
      suites: "smoke fail-closed fail-modes hop-trace go-ftw-smoke trailers connect-assert"
      body_mode: STREAMED
      timeout_minutes: 15

  e2e-full-duplex:
    name: e2e-full-duplex
    if: needs.changes.outputs.skip != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    needs: [changes, pin-check]
    uses: ./.github/workflows/live-e2e.yml
    with:
      # FULL_DUPLEX matches STREAMED product contract (fail-modes hang→504 N/A —
      # Envoy disables message_timeout). go-ftw-full via crs-full matrix.
      suites: "smoke fail-closed fail-modes hop-trace go-ftw-smoke trailers connect-assert"
      body_mode: FULL_DUPLEX_STREAMED
      timeout_minutes: 15

  ci-ok:
    name: ci-ok
    needs: [changes, pin-check, rust-quality, msrv, supply-chain, protos, e2e-pin, e2e-streamed, e2e-full-duplex]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed (or was skipped by design)
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP: ${{ needs.changes.outputs.skip }}
          E2E_WANTED: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          skip = os.environ["SKIP"] == "true"
          e2e_wanted = os.environ["E2E_WANTED"] == "true"
          heavy = {"rust-quality", "msrv", "supply-chain", "protos", "e2e-pin", "e2e-streamed", "e2e-full-duplex"}
          e2e_jobs = {"e2e-pin", "e2e-streamed", "e2e-full-duplex"}
          bad = []
          for job, v in needs.items():
              r = v["result"]
              ok = r == "success" or (r == "skipped" and (
                  (skip and job in heavy) or (job in e2e_jobs and not e2e_wanted)))
              print(f"{'ok  ' if ok else 'FAIL'} {job}: {r}")
              if not ok:
                  bad.append(f"{job}={r}")
          if bad:
              print(f"::error::ci-ok: {', '.join(bad)}")
              sys.exit(1)
          PY
