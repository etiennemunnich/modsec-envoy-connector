name: rust-toolchain
description: Install the Rust toolchain pinned in rust-toolchain.toml with the preinstalled rustup, and assert rustc is that version.

runs:
  using: composite
  steps:
    - name: Rust toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        set -euo pipefail
        want="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        [[ -n "${want}" ]] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
        rustup toolchain install
        got="$(rustc --version)"
        echo "${got}"
        [[ "${got}" == "rustc ${want} "* ]] || { echo "::error::rustc is '${got}', rust-toolchain.toml wants ${want}"; exit 1; }
