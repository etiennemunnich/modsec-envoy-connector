# Draft only — not published to Built on Envoy.
# Aligns with https://builtonenvoy.io/docs/extension-types/ (ext_proc).
# Do not open a BoE catalog PR until Etienne says go.

name: envoy-modsec-connex
version: 0.0.0
type: ext_proc
categories:
  - Security
author: Etienne Munnich
description: >
  Envoy External Processing connector that drives libmodsecurity
  (optional OWASP CRS) for HTTP request/response inspection.
longDescription: |
  Out-of-process gRPC ext_proc server intended to fail closed
  (failureModeAllow: false) and inspect HTTP traffic with ModSecurity v3.

  Lab-proven path: BUFFERED request/response bodies for HTTP.
  gRPC and WebSocket are not full CRS/protocol WAF surfaces —
  see repository docs for honest limits.

  This manifest is a foresight draft. The extension is not production-ready
  and is not submitted to the Built on Envoy catalog.
tags:
  - ext_proc
  - modsecurity
  - waf
  - security
  - rust
license: MIT-0
# minEnvoyVersion: "1.39.1"  # match experiment lab pin when packaging
examples:
  - title: Local lab (experiment repo)
    description: >
      Runnable proofs currently live in the private experiment repository
      (modsec-envoy-experiement), not yet migrated here.
    code: |
      # See experiment README: lab-up.sh + hop-trace.sh + lab-fail-closed.sh
extProc:
  grpcPort: 50051
  failureModeAllow: false
  messageTimeout: 5s
  processingMode:
    requestHeaderMode: SEND
    responseHeaderMode: SEND
    requestBodyMode: BUFFERED
    responseBodyMode: BUFFERED
