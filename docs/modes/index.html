<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>modsec-envoy-connector docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #0b3d2e;
    }
    body { font-size: 16px; }
    .markdown-section { max-width: 880px; }
    .markdown-section table { display: table; overflow: auto; }
  </style>
</head>
<body>
  <div id="app">Loading docs…</div>
  <script>
    window.$docsify = {
      name: 'modsec-envoy-connector docs',
      repo: 'etiennemunnich/modsec-envoy-connector',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'README.md',
      auto2top: true,
      search: 'auto',
      mermaid: { theme: 'neutral' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
