# DM STREAMED: request-path CRS same as BUFFERED; response phase-4 may miss
# (headers Continue → early body release). Leak expects 200 (honesty).
meta:
  author: "modsec-envoy-connector"
  description: "DM STREAMED — query/body CRS; response leak honesty (may reach client)"
  name: "demo-tests-dm-streamed.yaml"
rule_id: 949110
tests:
  - test_id: 1
    desc: "Benign GET / is allowed"
    stages:
      - input:
          method: GET
          uri: "/"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
        output:
          status: 200
  - test_id: 2
    desc: "SQLi in the query string is blocked"
    stages:
      - input:
          method: GET
          uri: "/search?q=1'%20UNION%20SELECT%201,2--"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
        output:
          status: 403
  - test_id: 3
    desc: "XSS in the query string is blocked"
    stages:
      - input:
          method: GET
          uri: "/page?q=%3Cscript%3Ealert(1)%3C/script%3E"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
        output:
          status: 403
  - test_id: 4
    desc: "Benign POST form body is allowed"
    stages:
      - input:
          method: POST
          uri: "/post"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Content-Type: "application/x-www-form-urlencoded"
          data: "name=alice&note=hello-world"
        output:
          status: 200
  - test_id: 5
    desc: "SQLi in a POST form body is blocked (status 403; origin may have seen early bytes)"
    stages:
      - input:
          method: POST
          uri: "/post"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Content-Type: "application/x-www-form-urlencoded"
          data: "var=1' UNION SELECT 1,2--"
        output:
          status: 403
  - test_id: 6
    desc: "XSS in a POST form body is blocked"
    stages:
      - input:
          method: POST
          uri: "/post"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Content-Type: "application/x-www-form-urlencoded"
          data: "comment=<script>alert(1)</script>"
        output:
          status: 403
  - test_id: 7
    desc: "SQLi in a JSON body is blocked"
    stages:
      - input:
          method: POST
          uri: "/api/search"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Content-Type: "application/json"
          data: "{\"q\":\"1' UNION SELECT password FROM users--\"}"
        output:
          status: 403
  - test_id: 8
    desc: "STREAMED response honesty: leak marker may reach client (200)"
    stages:
      - input:
          method: GET
          uri: "/leak"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
        output:
          status: 200
  - test_id: 9
    desc: "Cookie crumb + benign GET allowed"
    stages:
      - input:
          method: GET
          uri: "/"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Cookie: "session=abc; theme=light"
        output:
          status: 200
  - test_id: 10
    desc: "Cookie crumb + SQLi query blocked"
    stages:
      - input:
          method: GET
          uri: "/search?q=1'%20UNION%20SELECT%201--"
          version: HTTP/1.1
          headers:
            Host: "localhost"
            User-Agent: "OWASP CRS test agent"
            Accept: "*/*"
            Cookie: "session=abc"
        output:
          status: 403
