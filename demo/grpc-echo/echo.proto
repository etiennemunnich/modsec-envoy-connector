syntax = "proto3";

package echo;

option go_package = "github.com/etiennemunnich/modsec-envoy-connector/demo/grpc-echo;echo";

// Tiny unary-only service for the gRPC hop-trace demo.
// Not a product API — demo origin only.
service Echo {
  rpc Unary(EchoRequest) returns (EchoReply);
}

message EchoRequest {
  string text = 1;
}

message EchoReply {
  string text = 1;
}
