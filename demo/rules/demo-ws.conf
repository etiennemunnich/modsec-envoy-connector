# Demo-only early deny for WebSocket handshake bound tests.
# Phase-1 disruptive deny so Envoy never Continues the upgrade to the origin.
# Complements CRS (which may score at phase 1 and only block at phase 2 / 949110
# after headers Continue — measured: origin can see UPGRADE before client 403).

SecRule REQUEST_URI "@contains UNION" \
    "id:100201,phase:1,deny,status:403,log,msg:'ws demo: phase-1 UNION path deny'"
