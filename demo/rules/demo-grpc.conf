# Demo-only rules for gRPC hop-trace (loaded WITHOUT CRS by hop-trace-grpc.sh).
# Prove header/path ModSec decisions on application/grpc exchanges.
# Not a production policy. Not protobuf-aware CRS.

# Deny when client metadata asks for a probe deny (gRPC metadata → HTTP/2 header).
SecRule REQUEST_HEADERS:x-demo-grpc-probe "@streq deny" \
    "id:100101,phase:1,deny,status:403,log,msg:'grpc demo: probe deny header'"

# Deny when :path / REQUEST_URI carries a classic SQLi marker (path surface only).
SecRule REQUEST_URI "@contains UNION" \
    "id:100102,phase:1,deny,status:403,log,msg:'grpc demo: SQLi marker in path'"
