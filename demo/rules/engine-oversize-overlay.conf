# BUFFERED oversize overlay — included when buffered-oversize.sh reloads rules.
# Low SecRequestBodyLimit so Reject→413 is practical without multi-MiB posts.
# Stock engine.conf keeps 13 MiB for normal product demos; this overlay is
# suite-only and must not become the default product limit.
SecRequestBodyLimit 1024
SecRequestBodyNoFilesLimit 1024
SecRequestBodyLimitAction Reject
