# BUFFERED_PARTIAL overlay — included after engine.conf when BODY_MODE=BUFFERED_PARTIAL.
# Envoy's demo PARTIAL YAML sets per_connection_buffer_limit_bytes: 1048576 (1 MiB).
# Stock engine.conf SecRequestBodyNoFilesLimit is 128 KiB; without this raise, ModSec
# would Reject a legitimate 1 MiB PARTIAL prefix before CRS phase-2, masking the
# Envoy truncation honesty probes. Keep SecRequestBodyLimitAction Reject for true
# ModSec oversize; Envoy already truncates what the connector sees.
SecRequestBodyNoFilesLimit 2097152
