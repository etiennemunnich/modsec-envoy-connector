[package]
name = "ext-proc-modsec"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Etienne Munnich"]
repository = "https://github.com/etiennemunnich/modsec-envoy-connector"
readme = "../../README.md"
description = "Envoy ExternalProcessor (ext_proc) gRPC server that inspects request and response headers and bodies with libmodsecurity, fail-closed."
publish = false

[lib]
name = "ext_proc_modsec"
path = "src/lib.rs"

[[bin]]
name = "ext-proc-modsec"
path = "src/main.rs"

[dependencies]
modsec-engine = { path = "../modsec-engine" }
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["server", "codegen"] }
tonic-prost = { version = "0.14", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# gRPC client for the integration tests only; the shipped binary has no client stack.
tonic = { version = "0.14", default-features = false, features = ["server", "codegen", "channel"] }
# Enables the test-only fail-inject hook on modsec-engine for class-3 gRPC tests.
# Feature unification applies only when this crate's tests are built; product
# `cargo build -p ext-proc-modsec` keeps fail-inject off.
modsec-engine = { path = "../modsec-engine", features = ["fail-inject"] }
