# Integration-test SecLang (not CRS): one rule per phase the connector feeds.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json

SecRule REQUEST_URI "@contains /admin" \
    "id:910001,phase:1,deny,status:403,log,msg:'test phase1 deny'"
SecRule REQUEST_URI "@contains /teapot" \
    "id:910002,phase:1,deny,status:406,log,msg:'test phase1 deny 406'"
SecRule REQUEST_URI "@contains /go-away" \
    "id:910003,phase:1,redirect:https://example.test/bye,status:302,log,msg:'test redirect'"
SecRule REMOTE_ADDR "@ipMatch 192.0.2.66" \
    "id:910004,phase:1,deny,status:403,log,msg:'test REMOTE_ADDR from ext_proc attributes'"
SecRule REQUEST_BODY "@rx (?i)union\s+select" \
    "id:910005,phase:2,deny,status:403,log,msg:'test phase2 body SQLi'"
SecRule RESPONSE_HEADERS:X-Leak "@streq yes" \
    "id:910006,phase:3,deny,status:403,log,msg:'test phase3 response header'"
SecRule RESPONSE_BODY "@contains CONNEX-LEAK-MARKER" \
    "id:910007,phase:4,deny,status:403,log,msg:'test phase4 response body'"
