# Test-only SecLang (not CRS). Phase-4 response body inspection.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json

SecRule RESPONSE_BODY "@contains TEST-LEAK-MARKER" \
    "id:900020,phase:4,deny,status:403,log,msg:'test phase4 response body leak'"
