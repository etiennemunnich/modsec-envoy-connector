# Lab-only SecLang (not CRS). Phase-1 `drop` action.
#
# Upstream libmodsecurity v3.0.16 implements `drop` as deny/403
# ("executing deny instead of drop"). True status-0 Drop mapping is covered by
# unit tests of map_intervention(); this file documents live SecLang behavior.
SecRuleEngine On
SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecRule REQUEST_URI "@contains /drop-me" \
    "id:900011,phase:1,drop,log,msg:'lab phase1 drop'"
