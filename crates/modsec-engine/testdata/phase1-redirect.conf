# Lab-only SecLang (not CRS). Phase-1 redirect intervention.
# Exercises intervention.url → connector Location mapping.
SecRuleEngine On
SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecRule REQUEST_URI "@contains /go-away" \
    "id:900010,phase:1,redirect:http://example.test/bye,status:302,log,msg:'lab phase1 redirect'"
