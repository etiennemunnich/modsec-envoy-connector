# Lab-only SecLang (not CRS). Body-limit Reject fires mid-append.
# Official using_bodies_in_chunks + nginx check intervention after each append.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 32
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
# A ruleset needs at least one rule to load (Engine refuses 0-rule rulesets).
SecRule REQUEST_URI "@streq /__never-matches__" "id:920001,phase:1,deny,status:403"
