# Lab-only SecLang (not CRS). Phase-1 request headers: deny URI containing /admin.
# Attribution: exercises libmodsecurity C API via rust-modsecurity bindings.
SecRuleEngine On
SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecRule REQUEST_URI "@contains /admin" \
    "id:900001,phase:1,deny,status:403,log,msg:'lab phase1 deny admin path'"
