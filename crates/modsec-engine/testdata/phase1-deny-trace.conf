# Lab-only SecLang (not CRS). Phase-1 deny when REQUEST_METHOD is TRACE.
# The C API argument is named `protocol`; libmodsecurity stores it as the method.
SecRuleEngine On
SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecRule REQUEST_METHOD "@streq TRACE" \
    "id:900012,phase:1,deny,status:403,log,msg:'lab phase1 deny TRACE'"
