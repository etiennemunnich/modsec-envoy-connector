[package]
name = "modsec-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Etienne Munnich"]
repository = "https://github.com/etiennemunnich/modsec-envoy-connector"
readme = "../../README.md"
description = "Safe façade over libmodsecurity (v3.0.x) for the Envoy ext_proc connector: one transaction per HTTP exchange, request + response headers and bodies."
publish = false
# build.rs links the system libmodsecurity (>= 3.0.13) via the pkg-config tool.
links = "modsecurity"

[features]
# Test-only: lets gRPC integration tests force a mid-exchange EngineError.
# Never enable on product builds (`cargo build -p ext-proc-modsec`).
fail-inject = []

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }
