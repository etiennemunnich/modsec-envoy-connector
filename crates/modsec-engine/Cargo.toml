[package]
name = "modsec-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Etienne Munnich"]
description = "Safe façade over libmodsecurity (v3.0.x) for the Envoy ext_proc connector: one transaction per HTTP exchange, request + response headers and bodies."
publish = false

[dependencies]
# Links the system libmodsecurity via pkg-config (`modsecurity` ≥ 3.0.13).
modsecurity = "1.0.0"
thiserror = "2"
tracing = "0.1"
