# modsec-envoy-connector — Envoy ext_proc → libmodsecurity connector.
#
# Out-of-process ExternalProcessor gRPC server (not an Envoy dynamic module).
# `modsec-engine` owns all FFI; `ext-proc-modsec` is the product binary.

[workspace]
resolver = "2"
members = ["crates/ext-proc-modsec", "crates/modsec-engine"]
