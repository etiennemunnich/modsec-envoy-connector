# Workspace for Envoy ext_proc → libmodsecurity connector (connex).
#
# Not a Built on Envoy Rust dynamic-module crate (cdylib / HttpFilter).
# Product is an out-of-process ExternalProcessor gRPC server — see docs/boe/.
#
# Scaffold aligned with experiment layout (ext-proc binary + modsec-engine).
# Native FFI / full connector migrate from modsec-envoy-experiement deliberately.

[workspace]
resolver = "2"
members = ["crates/ext-proc-modsec", "crates/modsec-engine"]
